<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - BookCompass</title>
    <link rel="stylesheet" href="src/style/UProfile_style.css">
    <link rel="shortcut icon" href="src/img/favicon.webp" type="image/webp">
    <script src="src/JS/UProfile_script.js" defer></script>
</head>
<body>

    <header class="profile-header">
        <a href="Index.html" class="back-home-link">← Back to BookCompass</a>
    </header>

    <main class="profile-container">
        <form action="/update-profile" method="POST" enctype="multipart/form-data" id="profileForm">
            
            <section class="profile-sidebar">
                <div class="avatar-upload">
                    <div class="avatar-preview">
                        <img id="avatarImage" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&h=150&q=80" alt="Profile Picture">
                    </div>
                    <label for="profile-pic" class="file-label">Change Photo</label>
                    <input type="file" id="profile-pic" name="profile-pic" accept="image/*">
                </div>

                <div class="field-group">
                    <label for="bio">Reader Bio</label>
                    <textarea id="bio" name="bio" rows="4" placeholder="Tell us about your favorite genres, authors, or your current reading goals..."></textarea>
                </div>
            </section>

            <section class="profile-main-form">
                <h2>Account Settings</h2>
                <p class="subtitle">Update your personal information and how you appear on the app.</p>
                
                <fieldset class="form-grid">
                    <div class="field-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="bookworm99" required>
                    </div>

                    <div class="field-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com" required>
                    </div>

                    <div class="field-group">
                        <label for="fname">First Name</label>
                        <input type="text" id="fname" name="fname" placeholder="John">
                    </div>

                    <div class="field-group">
                        <label for="lname">Last Name</label>
                        <input type="text" id="lname" name="lname" placeholder="Doe">
                    </div>
                </fieldset>

                <fieldset class="preferences-section">
                    <h3>Your Reading Preferences</h3>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="fav-genres" value="fantasy"> Fantasy</label>
                        <label><input type="checkbox" name="fav-genres" value="mystery"> Mystery</label>
                        <label><input type="checkbox" name="fav-genres" value="romance"> Romance</label>
                        <label><input type="checkbox" name="fav-genres" value="sci-fi"> Sci-Fi</label>
                    </div>
                </fieldset>

                <div class="form-actions">
                    <button type="submit" class="btn-save">Save Changes</button>
                    <button type="button" class="btn-cancel">Cancel</button>
                </div>
            </section>

        </form>
    </main>

</body>
</html>
